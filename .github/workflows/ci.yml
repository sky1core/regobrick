name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  staticcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - run: staticcheck ./...

  bench-smoke:
    # Compile-and-run check for every benchmark (single iteration). Real
    # measurements are taken manually; see internal/bench/benchcommon.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -bench . -benchtime 1x ./...

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run '^$' -fuzz FuzzExpandExponent -fuzztime 20s .
      - run: go test -run '^$' -fuzz FuzzParseDecimal -fuzztime 20s .
      - run: go test -run '^$' -fuzz FuzzNumberJSONRoundTrip -fuzztime 20s .
      - run: go test -run '^$' -fuzz FuzzNumberScanFloat -fuzztime 20s .

  govulncheck:
    # Blocking: the toolchain directive is kept at the lowest patch release
    # with zero called vulnerabilities (currently go1.25.12), so a red run
    # means either a newly published vulnerability or a regression — both
    # worth failing CI for. Standard-library findings are resolved by
    # toolchain bumps, not code changes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...
      - run: govulncheck -tags integration ./...
        working-directory: tests/integration

  deps-scan:
    # Lockfile-level dependency scans over both modules. Complements the
    # govulncheck job (call-graph based): these fail on any known-vulnerable
    # dependency version regardless of reachability, and consume the triage
    # files (tests/integration/osv-scanner.toml, .trivyignore) so documented
    # ignore decisions apply in CI exactly as they do in local pre-push hooks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0
      - run: osv-scanner scan source --allow-no-lockfiles -r .
      - run: curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/75c4dc0f45c5d7ffd05ae26df1e0c666787bdf2a/contrib/install.sh | sh -s -- -b "$HOME/.local/bin" v0.69.3
      - run: $HOME/.local/bin/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress go.mod
      - run: $HOME/.local/bin/trivy fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress tests/integration/go.mod

  integration:
    # Real-database tests via testcontainers; requires the Docker daemon
    # provided by ubuntu-latest runners.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tests/integration/go.mod
      - run: go test -tags=integration -v ./...
        working-directory: tests/integration
